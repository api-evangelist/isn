aid: isn
name: ISN
description: 'ISN Software Corporation, which trades as ISN, is a Dallas, Texas based
  contractor and supplier information management company founded in 2001. Its subscription
  platform ISNetworld collects, verifies and continuously monitors health and safety,
  quality, insurance, training, cybersecurity and sustainability data on contractors
  and suppliers, then connects that record to the hiring clients who engage them across
  energy, chemicals, manufacturing, mining, utilities, construction, food and beverage,
  and telecom. ISN operates in more than 85 countries from offices in Dallas, Midland,
  Calgary, Montreal, Toronto, Mexico City, London, Perth, Sydney, Auckland, Dubai and
  Paris, and also ships ISN Empower, a worker-facing mobile app and learning management
  tool. The company is employee owned; Blackstone took a significant minority stake in
  December 2020 at a valuation above USD 2 billion. ISN runs a production REST API at
  api.isnetworld.com that lets subscribers pull their own ISNetworld data into internal
  systems, but the API is documented only to customers and there is no public developer
  portal, OpenAPI description, or SDK.'
