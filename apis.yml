apis:
- aid: isn:isnetworld-api
  name: ISNetworld API
  description: 'The ISNetworld API is a RESTful, bearer-token authenticated HTTP API
    that lets ISN subscribers download their own ISNetworld data — company profile
    scorecards, connected contractor lists and related compliance records — for
    integration with internal systems. A client exchanges a UserKey and CompanyKey
    header pair at GET /token for a bearer token, validates it at GET /validate-token,
    and calls versioned resource paths under /1.0/. Requests must use TLS 1.2 or later.
    ISN publishes no OpenAPI description and no public reference; the Developer
    Integration Guide is issued to subscribers and the API''s own help surface at
    /help is authentication-gated.'
