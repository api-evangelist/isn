generated: '2026-08-23'
method: searched
source: >-
  ISN Trust Center at https://www.isnetworld.com/en/trust-center (HTTP 200,
  2026-08-23) for the certification claims; live probes of api.isnetworld.com for the
  protocol-level assertions.
standards:
- id: rfc9457-problem-details
  conforms: true
  evidence: >-
    GET https://api.isnetworld.com/token returns Content-Type
    application/problem+json with a body carrying type, title, status and traceId.
    Observed on the wire 2026-08-23.
  caveat: >-
    Applied inconsistently — /validate-token returns a bare JSON boolean and /1.0/
    resource paths return an empty 401 body.
- id: w3c-trace-context
  conforms: true
  evidence: >-
    The traceId member of the problem body is a traceparent string in the
    00-<trace-id>-<span-id>-<flags> form.
- id: rfc6750-bearer-token
  conforms: true
  evidence: >-
    GET https://api.isnetworld.com/ returns WWW-Authenticate: Bearer; ISN documents
    passing the token via the Authorization header.
- id: tls-1.2-minimum
  conforms: true
  evidence: >-
    ISN requires TLS 1.2 or later; the host negotiates TLSv1.2 and sets
    Strict-Transport-Security: max-age=31536000; includeSubDomains.
- id: oauth2
  conforms: false
  evidence: >-
    Authentication is a proprietary static-key exchange (UserKey + CompanyKey headers
    at GET /token), not an OAuth 2.0 grant. No authorization endpoint, no scopes, no
    /.well-known/oauth-authorization-server (probed 404).
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on every ISN host.
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI or Swagger description is published. /openapi.json, /openapi.yaml,
    /swagger.json, /swagger/v1/swagger.json, /api-docs, /docs and /redoc all return 404
    on api.isnetworld.com.
- id: asyncapi
  conforms: false
  evidence: No event, streaming or webhook surface is published.
- id: graphql
  conforms: false
  evidence: POST /graphql returns 404 on api.isnetworld.com.
- id: mcp
  conforms: false
  evidence: >-
    POST tools/list returns 404 on api.isnetworld.com/mcp; mcp.isnetworld.com does not
    resolve.
- id: a2a
  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json return 404 on
    api.isnetworld.com, www.isnetworld.com and www.isn.com.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every ISN host.
- id: rfc8594-sunset-header
  conforms: unknown
  evidence: >-
    No 2xx response is obtainable without credentials, so the presence of a Sunset or
    Deprecation header cannot be measured.
