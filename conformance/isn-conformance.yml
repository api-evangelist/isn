domain_standard:
  assessed: true
  conforms: false
  note: >-
    Contractor and supplier prequalification has no dominant machine-readable
    interchange standard of the kind SCIM, OData, OpenRTB, HL7 or OneRoster provide in
    their markets, and ISN's contract declares none. The nearest adjacent schemes —
    OSHA incident recordkeeping classifications and ISO 45001 occupational health and
    safety management — govern the data ISN collects rather than the wire format it
    exposes, and neither appears as a schema, URN or content type on the API. Recorded
    as assessed-and-absent rather than left blank; this is reward-only scoring and no
    conformance is invented to fill the slot.
